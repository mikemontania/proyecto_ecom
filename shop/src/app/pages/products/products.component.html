<section class="products">
  <div class="container">
    <h1>Productos</h1>
    <div class="search">
      <input [(ngModel)]="search" placeholder="Buscar..." />
      <a [routerLink]="['/productos']" [queryParams]="{ search }" class="btn">Buscar</a>
    </div>
    <div class="grid">
      <a *ngFor="let p of products" [routerLink]="['/producto', p.slug]" class="card">
        <h3>{{ p.name }}</h3>
        <p *ngIf="p.description">{{ p.description }}</p>
      </a>
    </div>
  </div>
</section>
