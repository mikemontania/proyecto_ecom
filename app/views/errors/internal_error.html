<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>Cavallaro S.A.C.e.I</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;1,100;1,300;1,400;1,500&display=swap" rel="stylesheet">

    <style>
        html,body {
          margin: 0;
          font-family: 'Roboto', sans-serif;
        }

        .rails-default-bg-500 {
          width: 100%;
          height: 100%;
          text-align: center;
        }

        .rails-default-bg-500 > img {
          position: relative;
          top: -10px;
        }

        .error-wrapper {
          text-align: center;
          margin: 8rem 0;
        }

        .h1-error-code {
          font-weight: bold;
          color: #a9acaf;
          margin-top: 1rem;
          font-size: 5rem;
        }

        .h2-error-status {
          font-weight: 600;
          margin-top: 2rem;
          color: #a9acaf;
        }

        .button-wrapper {
          text-align: center;
        }

        .button-back {
          background: #e80e10;
          color: white;
          font-size: 14px;
          display: inline-block;
          text-align: center;
          padding: 10px 20px;
          text-decoration: none;
          font-weight: 600;
          border-radius: 5px;
        }
    </style>
  </head>

  <body>
    <div class="rails-default-bg-500">
      <img src="logo-solo.png">
      <h1 class="h1-error-code">500</h1>
      <h2 class="h2-error-status">Error interno del servidor<br> Por favor intenta de nuevo más tarde.</h2>

      <div class="button-wrapper">
        <a href="https://www.cavallaro.com.py" class="button-back">Ir al inicio</a>
      </div>
    </div>
  </body>

</html>
